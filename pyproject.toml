[project]
name = "zeitgeber"
version = "1.0.0"
description = "Code for 'Funding deadlines act as a zeitgeber for science'"
readme = "README.md"
authors = [{ name = "Haining Wang", email = "hw56@iu.edu" }, { name = "Jing Su", email = "su1@iu.edu" }]
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.108",
    "duckdb>=1.1",
    "httpx==0.28.1",
    "lxml==6.1.3",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pyfixest==0.60.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "tqdm==4.70.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pulse"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
